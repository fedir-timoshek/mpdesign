name: CI-CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content audit
        run: npm run content:audit

      - name: Content audit (strict)
        run: npm run content:audit:strict

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ secrets.NEXT_PUBLIC_LEAD_ENDPOINT }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          CONTENT_API_URL: ${{ secrets.CONTENT_API_URL }}
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/

  deploy_staging:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hetzner staging via SFTP
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_PATH: ${{ secrets.HETZNER_STAGING_PATH }}
        run: |
          lftp -u "$HETZNER_USERNAME","$HETZNER_PASSWORD" sftp://$HETZNER_HOST <<'LFTP'
          set sftp:auto-confirm yes
          mirror -R --delete --parallel=2 out "$HETZNER_PATH"
          bye
          LFTP

      - name: Smoke check staging
        env:
          SMOKE_BASE_URL: ${{ secrets.HETZNER_STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "Missing HETZNER_STAGING_URL secret."
            exit 1
          fi
          bash scripts/smoke-check.sh "$SMOKE_BASE_URL"

  deploy_production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hetzner production via SFTP
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_PATH: ${{ secrets.HETZNER_PRODUCTION_PATH }}
        run: |
          lftp -u "$HETZNER_USERNAME","$HETZNER_PASSWORD" sftp://$HETZNER_HOST <<'LFTP'
          set sftp:auto-confirm yes
          mirror -R --delete --parallel=2 out "$HETZNER_PATH"
          bye
          LFTP

      - name: Smoke check production
        env:
          SMOKE_BASE_URL: ${{ secrets.HETZNER_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "Missing HETZNER_PRODUCTION_URL secret."
            exit 1
          fi
          bash scripts/smoke-check.sh "$SMOKE_BASE_URL"
